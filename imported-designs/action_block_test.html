<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Action Block Test</title>
  <style>
    :root{
      --bg:#f7f3ec;
      --shell:#efe7da;
      --surface:#fffdf9;
      --hero:#2a251f;
      --hero-elevated:#221d18;
      --hero-muted:#d6cec3;
      --accent:#1D9E75;
      --accent-text:#b8f0db;
      --border:rgba(255,255,255,0.08);
      --font: "DM Sans", system-ui, sans-serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#171411;
      font-family:var(--font);
      color:#1e1c18;
    }
    .phone{
      width:390px;
      min-height:844px;
      background:linear-gradient(180deg, #f5f1e9 0%, #efe7da 100%);
      border-radius:36px;
      padding:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.32);
    }
    .screen{
      min-height:100%;
      background:var(--bg);
      border-radius:28px;
      padding:18px 14px 24px;
      border:1px solid rgba(160,140,112,.14);
    }
    .hero{
      background:linear-gradient(180deg, var(--hero) 0%, var(--hero-elevated) 100%);
      border-radius:22px;
      padding:14px;
      color:#fff;
      box-shadow:0 14px 30px rgba(28,22,15,.18);
    }
    .actions{display:flex;flex-direction:column;gap:6px;}
    .record,
    .resisted{
      border-radius:15px;
      border:1px solid var(--border);
      cursor:pointer;
    }
    .record{
      background:#1f1b17;
      color:#faf9f6;
      display:flex;
      align-items:center;
      gap:8px;
      text-align:left;
      padding:8px 10px;
    }
    .record-icon{
      width:28px;
      height:28px;
      border-radius:9px;
      background:rgba(255,255,255,.1);
      display:grid;
      place-items:center;
      font-size:17px;
      flex:0 0 auto;
    }
    .record-copy{
      flex:1;
      min-width:0;
    }
    .record-title{
      font-size:12px;
      font-weight:700;
      line-height:1.16;
    }
    .record-sub{
      margin-top:1px;
      font-size:9.5px;
      line-height:1.12;
      color:#a79d91;
    }
    .record-meta{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:6px;
      flex:0 0 auto;
      padding-left:4px;
    }
    .record-limit{
      min-width:29px;
      text-align:center;
      padding:2px 6px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.06);
      color:var(--accent-text);
      font-size:9px;
      font-weight:700;
      line-height:1;
    }
    .record-arrow{
      color:#b4aa9d;
      font-size:14px;
      line-height:1;
    }
    .resisted{
      min-height:40px;
      display:grid;
      place-items:center;
      padding:8px 10px;
      background:rgba(255,255,255,.08);
      color:#faf9f6;
      font-size:12px;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="hero" id="hero">
        <div class="actions">
          <button class="record" type="button">
            <div class="record-icon">+</div>
            <div class="record-copy">
              <div class="record-title">Зафиксировать срыв</div>
              <div class="record-sub">быстро · два касания</div>
            </div>
            <div class="record-meta">
              <div class="record-limit">2/5</div>
              <div class="record-arrow">›</div>
            </div>
          </button>
          <button class="resisted" type="button">Удержался</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
